[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purrito-catgt-wrapper"
dynamic = ["version"]
description = "A Python wrapper for the CatGt command-line tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eliezyer" }]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/eliezyer/purrito"
Repository = "https://github.com/eliezyer/purrito"
Issues = "https://github.com/eliezyer/purrito/issues"

[tool.setuptools.dynamic]
version = { attr = "purrito.__version__" }

[tool.setuptools.packages.find]
include = ["purrito*"]
